<!doctype html>
<!-- Sky Collector card back option 3, "Dusk" (2026-11-15). Deep night blue fading to an orange horizon,
     aircraft silhouettes with lit nav lights (red port, green starboard, white tail, red beacon),
     sunset-lit contrails, runway approach lights on the ground. Family frame. 900x1359. -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family:'RO'; src:url('../../../fonts/RussoOne-Regular.woff2') format('woff2'); }
@font-face { font-family:'BC'; src:url('../../../fonts/BarlowCondensed-Medium.woff2') format('woff2'); }
html,body { margin:0; width:900px; height:1359px; overflow:hidden; background:#080f1b; }
svg { display:block; }
</style></head>
<body>
<svg id="s" viewBox="0 0 900 1359" width="900" height="1359" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
const W = 900, H = 1359, CX = 450, HZ = 1078;
const CREAM = '#fff2b3', INK = '#fffdf6', OR = '#fa8127', BG = '#080f1b';
let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const out = []; const add = s => out.push(s);
function star(x, y, r, col, k = .16) {
  const p = [[0,-r],[r*k,-r*k],[r,0],[r*k,r*k],[0,r],[-r*k,r*k],[-r,0],[-r*k,-r*k]].map(([a,b]) => `${(x+a).toFixed(1)},${(y+b).toFixed(1)}`).join(' ');
  return `<polygon points="${p}" fill="${col}"/>`;
}
const JET = 'M32 3c2.2 0 3.4 3 3.4 6.5V24l22.6 12.2v4.3L35.4 34v15.2l7.2 5.6v3.6L32 55.6l-10.6 2.8v-3.6l7.2-5.6V34L6 40.5v-4.3L28.6 24V9.5C28.6 6 29.8 3 32 3z';

add(`<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#060c19"/><stop offset=".28" stop-color="#0f2142"/><stop offset=".5" stop-color="#26346a"/>
    <stop offset=".64" stop-color="#5a3f78"/><stop offset=".72" stop-color="#a24c6a"/><stop offset=".77" stop-color="#e06a3c"/>
    <stop offset=".795" stop-color="#ffa45a"/><stop offset=".8" stop-color="#ffd08a"/></linearGradient>
  <radialGradient id="sun" cx="450" cy="${HZ}" r="520" gradientUnits="userSpaceOnUse" gradientTransform="translate(0 ${HZ}) scale(1 .5) translate(0 -${HZ})">
    <stop offset="0" stop-color="#ffd890" stop-opacity=".95"/><stop offset=".35" stop-color="#fa8127" stop-opacity=".45"/><stop offset="1" stop-color="#fa8127" stop-opacity="0"/></radialGradient>
  <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fffdf6"/><stop offset=".46" stop-color="#fff2b3"/><stop offset=".5" stop-color="#e8c98a"/><stop offset="1" stop-color="#ffd9a8"/></linearGradient>
  <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="2.4"/></filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  <clipPath id="inner"><rect x="24" y="24" width="852" height="1311" rx="28"/></clipPath>
</defs>`);
add(`<g clip-path="url(#inner)">`);
add(`<rect width="${W}" height="${H}" fill="url(#sky)"/>`);
add(`<rect width="${W}" height="${H}" fill="url(#sun)"/>`);
// stars, fading toward the horizon
let st = '';
for (let i = 0; i < 230; i++) {
  const y = 90 + Math.pow(rnd(), 1.7) * 640, x = 36 + rnd() * 828;
  const o = Math.max(0, .85 - y / 820) * (.4 + rnd() * .6);
  st += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(.5 + rnd() * 1.1).toFixed(2)}" fill="${INK}" opacity="${o.toFixed(2)}"/>`;
}
add(st);
add(star(118, 150, 13, INK) + star(790, 300, 10, CREAM) + star(330, 120, 8, INK) + star(612, 470, 7, CREAM));
// crescent moon
add(`<path d="M198 196 a46 46 0 1 0 54 64 a38 38 0 1 1 -54 -64z" fill="#fff2b3" opacity=".92"/>`);

// contrails: [path, start, control, end, scale, kind, headingDeg]
function trail(x0, y0, cx, cy, x1, y1, w, id) {
  add(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}">
    <stop offset="0" stop-color="#ffd6b0" stop-opacity="0"/><stop offset=".7" stop-color="#ffe2c4" stop-opacity=".55"/><stop offset="1" stop-color="#fff3e0" stop-opacity=".95"/></linearGradient>`);
  const d = `M${x0} ${y0} Q ${cx} ${cy} ${x1} ${y1}`;
  add(`<path d="${d}" fill="none" stroke="url(#${id})" stroke-width="${w * 3.2}" stroke-linecap="round" filter="url(#soft)" opacity=".7"/>`);
  add(`<path d="${d}" fill="none" stroke="url(#${id})" stroke-width="${w}" stroke-linecap="round"/>`);
  return Math.atan2(y1 - cy, x1 - cx) * 180 / Math.PI + 90;
}
function jet(x, y, rot, sc) {
  // nose along -y in glyph space; position the nose a little past the trail end
  add(`<g transform="translate(${x} ${y}) rotate(${rot.toFixed(1)}) scale(${sc}) translate(-32 -40)">
    <path d="${JET}" fill="#0b1325" stroke="#ffb27a" stroke-opacity=".55" stroke-width="${(1.1 / sc * 1.4).toFixed(2)}"/>
    <circle cx="6" cy="38.4" r="3.4" fill="#ff3b30" filter="url(#glow)"/><circle cx="6" cy="38.4" r="1.4" fill="#ffb0a8"/>
    <circle cx="58" cy="38.4" r="3.4" fill="#2bff88" filter="url(#glow)"/><circle cx="58" cy="38.4" r="1.4" fill="#c4ffd8"/>
    <circle cx="32" cy="57" r="3" fill="#ffffff" filter="url(#glow)"/><circle cx="32" cy="57" r="1.3" fill="#fff"/>
    <circle cx="32" cy="30" r="2.6" fill="#ff5a3c" filter="url(#glow)"/>
  </g>`);
}
let h;
h = trail(40, 600, 330, 330, 640, 268, 3.2, 't1'); jet(662, 265, h, 2.1);
h = trail(456, 196, 620, 150, 792, 160, 1.8, 't2'); jet(808, 161, h, .95);
h = trail(870, 1000, 600, 902, 318, 902, 2.6, 't3'); jet(296, 902, h, 1.45);

// helicopter low over the horizon with its beacon and a searchlight cone
add(`<g transform="translate(150 1000)">
  <path d="M0 6 L-70 86 L40 86 Z" fill="#ffe6b0" opacity=".12"/>
  <g transform="rotate(-8) scale(1.05) translate(-32 -32)" fill="#0b1325">
    <ellipse cx="32" cy="34" rx="16" ry="9"/><path d="M46 31 L84 27 L86 22 L90 22 L90 34 L84 34 L46 38z"/>
    <path d="M22 44 h22 M18 47 h30" stroke="#0b1325" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-6 22 H70" stroke="#0b1325" stroke-width="2.6" stroke-linecap="round"/><rect x="30" y="22" width="4" height="4"/>
    <circle cx="32" cy="22" r="3" fill="#ff3b30" filter="url(#glow)"/>
    <circle cx="88" cy="24" r="2.4" fill="#fff" filter="url(#glow)"/>
  </g></g>`);

// ground: hills and a runway with approach lights converging on the horizon
add(`<path d="M0 ${HZ + 8} C 120 ${HZ - 22} 230 ${HZ - 4} 330 ${HZ + 4} S 520 ${HZ - 26} 640 ${HZ - 2} S 820 ${HZ - 20} 900 ${HZ} V ${H} H 0 Z" fill="#0a1020"/>`);
add(`<path d="M0 ${HZ + 40} C 180 ${HZ + 18} 300 ${HZ + 34} 450 ${HZ + 30} S 760 ${HZ + 16} 900 ${HZ + 36} V ${H} H 0 Z" fill="#060a14"/>`);
let L = '';
for (let i = 0; i < 9; i++) {
  const t = i / 8, y = HZ + 44 + Math.pow(t, 1.6) * 138, sp = 16 + Math.pow(t, 1.6) * 220, r = 1.6 + t * 3.4;
  for (const s of [-1, 1]) {
    L += `<circle cx="${CX + s * sp}" cy="${y.toFixed(1)}" r="${(r * 2.2).toFixed(1)}" fill="#ffb347" opacity=".5" filter="url(#glow)"/><circle cx="${CX + s * sp}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="#ffe2a6"/>`;
  }
  L += `<circle cx="${CX}" cy="${y.toFixed(1)}" r="${(r * .8).toFixed(1)}" fill="#fff" opacity=".9"/>`;
}
for (let i = -3; i <= 3; i++) L += `<circle cx="${CX + i * 9}" cy="${HZ + 38}" r="1.8" fill="#2bff88"/>`;
add(L);
// distant city glimmer on the horizon
let c = '';
for (let i = 0; i < 70; i++) c += `<circle cx="${(36 + rnd() * 828).toFixed(1)}" cy="${(HZ + 6 + rnd() * 26).toFixed(1)}" r="${(.6 + rnd() * .9).toFixed(1)}" fill="#ffd08a" opacity="${(.3 + rnd() * .6).toFixed(2)}"/>`;
add(c);
add(`</g>`);

// wordmark + tagline
const CY = 640;
const word = (txt, y, size, len) => {
  const common = `x="${CX}" y="${y}" font-family="RO" font-size="${size}" text-anchor="middle" textLength="${len}" lengthAdjust="spacingAndGlyphs"`;
  return `<text ${common} transform="translate(0 7)" fill="#000" opacity=".55" stroke="#000" stroke-width="12" stroke-linejoin="round">${txt}</text>
    <text ${common} fill="url(#chrome)" stroke="${BG}" stroke-width="10" stroke-linejoin="round" paint-order="stroke">${txt}</text>`;
};
add(word('SKY', CY - 2, 150, 300));
add(word('COLLECTOR', CY + 92, 88, 486));
add(`<text x="${CX}" y="${CY + 160}" font-family="BC" font-size="31" letter-spacing="11" text-anchor="middle" fill="${CREAM}" opacity=".9" stroke="${BG}" stroke-width="5" paint-order="stroke">CATCH WHAT FLIES</text>`);

// family frame
add(`<g fill="none" stroke="${CREAM}" stroke-opacity=".9">
  <rect x="22" y="22" width="856" height="1315" rx="30" stroke-width="2.6"/>
  <path d="M22 82 H878 M22 1277 H878" stroke-width="1.6" stroke-opacity=".6"/>
  <path d="M62 52 H392 M508 52 H838 M62 1307 H392 M508 1307 H838" stroke-width="1.8"/>
  <path d="M410 38 V66 M490 38 V66 M410 1293 V1321 M490 1293 V1321" stroke-width="2"/>
</g>`);
add(star(CX, 52, 20, OR, .18) + star(CX, 1307, 20, OR, .18));
document.getElementById('s').innerHTML = out.join('\n');
</script>
</body></html>
